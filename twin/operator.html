<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator console (twin)</title>
<style>
  :root { --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1f22; --muted: #6b7078; --line: #e2e3e0;
          --accent: #2f6fdb; --ok: #1f8a4c; --warn: #b26b00; --stop: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141518; --panel: #1d1f23; --ink: #e9eaec; --muted: #9aa0a8; --line: #2c2f35;
            --accent: #6b9cff; --ok: #4cc27f; --warn: #f0a640; --stop: #ff5a52; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .req { font-size: 22px; font-weight: 600; min-height: 34px; }
  .idle { color: var(--muted); font-weight: 400; font-size: 17px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button { font: inherit; font-weight: 600; border-radius: 9px; border: 1px solid var(--line); padding: 10px 16px; cursor: pointer; background: var(--panel); color: var(--ink); }
  button:disabled { opacity: .4; cursor: default; }
  .done { background: var(--ok); border-color: var(--ok); color: #fff; }
  .stop { background: var(--stop); border-color: var(--stop); color: #fff; }
  .kbd { font-weight: 400; opacity: .75; font-size: 12px; margin-left: 6px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--muted); }
  .halted { color: var(--stop); font-weight: 600; }
  input[type=text] { font: inherit; width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-top: 12px; display: none; }
</style>
</head>
<body>
<main>
  <h1>Operator console</h1>
  <div class="sub">Digital twin of the egg-white rig. Requests from the agent's tools appear here.</div>
  <div class="card">
    <div id="req" class="req idle">No request.</div>
    <input id="note" type="text" placeholder="What is the problem? (Enter to send)">
    <div class="row">
      <button id="done" class="done" disabled>Done<span class="kbd">Enter</span></button>
      <button id="problem" disabled>Problem<span class="kbd">X</span></button>
      <button id="stop" class="stop">Stop<span class="kbd">Esc</span></button>
      <button id="clear" hidden>Clear halt</button>
    </div>
  </div>
  <div class="card">
    <dl>
      <dt>Safety</dt><dd id="safety">…</dd>
      <dt>Bed</dt><dd id="bed">…</dd>
      <dt>Homed</dt><dd id="homed">…</dd>
      <dt>Loaded wells</dt><dd id="loaded">…</dd>
      <dt>Running</dt><dd id="running">…</dd>
      <dt>Simulated operator</dt><dd id="auto">…</dd>
    </dl>
  </div>
</main>
<script>
const TOKEN = "__CLEAR_TOKEN__";
let current = null;
const $ = (id) => document.getElementById(id);
async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  return r.json();
}
async function refresh() {
  try {
    const s = await (await fetch("/operator/state")).json();
    current = s.request;
    $("req").textContent = current ? current.text : "No request.";
    $("req").className = "req" + (current ? "" : " idle");
    $("done").disabled = $("problem").disabled = !current;
    const halted = s.safety.state === "halted";
    $("safety").innerHTML = halted ? `<span class="halted">halted</span> — ${s.safety.reason || ""}` : s.safety.state;
    $("clear").hidden = !halted;
    $("bed").textContent = `${s.bed_c.toFixed(1)} °C (target ${s.target_c} °C)`;
    $("homed").textContent = s.homed ? "yes" : "no";
    $("loaded").textContent = s.loaded_wells.length ? s.loaded_wells.join(", ") : "none";
    $("running").textContent = s.running || "—";
    $("auto").textContent = s.auto_operator ? "on (answers Done by itself)" : "off";
  } catch (e) { $("req").textContent = "Twin not reachable."; }
}
async function answer(kind, note) {
  if (!current) return;
  await post("/operator/answer", {id: current.id, answer: kind, note: note || ""});
  $("note").style.display = "none"; $("note").value = "";
  refresh();
}
$("done").onclick = () => answer("done");
$("problem").onclick = () => { $("note").style.display = "block"; $("note").focus(); };
$("note").onkeydown = (e) => { if (e.key === "Enter") { e.stopPropagation(); answer("problem", $("note").value); } };
$("stop").onclick = () => post("/operator/stop", {who: "operator console"}).then(refresh);
$("clear").onclick = () => post("/operator/clear", {token: TOKEN}).then(refresh);
document.addEventListener("keydown", (e) => {
  if (document.activeElement === $("note")) return;
  if (e.key === "Enter") answer("done");
  else if (e.key === "x" || e.key === "X") $("problem").click();
  else if (e.key === "Escape") $("stop").click();
});
refresh(); setInterval(refresh, 500);
</script>
</body>
</html>
